<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Replace with the source-backed advertising message.">
    <title>Product video ad</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; min-height: 100%; }
      body { display: grid; place-items: center; background: transparent; font-family: system-ui, sans-serif; }
      /* Change the aspect ratio and Remotion dimensions together. The host controls available space. */
      .ad-card { position: relative; aspect-ratio: 9/16; width: min(100%, 56.25svh); overflow: hidden; background: #f4f5f7; container-type: inline-size; }
      video { display: block; width: 100%; height: 100%; object-fit: contain; }
      /* CTA artwork lives in Remotion; this is its accessible click target. */
      #cta { position: absolute; left: 8%; width: 84%; bottom: 7%; height: 7.5%; border-radius: 1.8cqw; }
      #cta:focus-visible { outline: 3px solid #111; outline-offset: 4px; }
      #motion-toggle { position: absolute; right: 3%; top: 2%; min-width: 44px; min-height: 44px; padding: 5px 10px; border: 1px solid #687078; border-radius: 5px; color: #111318; background: #ffffffed; font: 12px system-ui, sans-serif; cursor: pointer; }
      #motion-toggle:focus-visible { outline: 3px solid #111; outline-offset: 2px; }
      #motion-toggle:disabled { cursor: default; }
    </style>
  </head>
  <body>
    <main class="ad-card" aria-label="Product advertising video">
      <video id="hero-video" src="./hero.mp4" poster="./poster.jpg" autoplay muted loop playsinline preload="metadata" aria-label="Replace with a concise description of the complete video ad"></video>
      <a id="cta" href="https://example.com" target="_blank" rel="noopener noreferrer" aria-label="Learn more about the product"></a>
      <button hidden id="motion-toggle" type="button" aria-controls="hero-video" aria-pressed="false">Pause</button>
    </main>
    <script>
      (function () {
        var video = document.getElementById("hero-video");
        var button = document.getElementById("motion-toggle");
        var preference = window.matchMedia("(prefers-reduced-motion: reduce)");
        var userPaused = false;
        var restoredMedia = null;
        function updatePlayback() {
          if (preference.matches) {
            video.removeAttribute("autoplay");
            video.pause();
            var media = JSON.stringify([video.getAttribute("src"), video.getAttribute("poster")]);
            if (restoredMedia !== media) {
              restoredMedia = media;
              video.load();
            }
          } else {
            restoredMedia = null;
            if (document.hidden || userPaused) video.pause();
            else video.play().catch(function () {});
          }
          if (button) {
            button.disabled = preference.matches;
            button.textContent = preference.matches ? "Motion off" : userPaused ? "Play" : "Pause";
            button.setAttribute("aria-pressed", String(userPaused || preference.matches));
          }
        }
        if (button) button.addEventListener("click", function () { userPaused = !userPaused; updatePlayback(); });
        video.addEventListener("loadedmetadata", updatePlayback);
        preference.addEventListener("change", updatePlayback);
        document.addEventListener("visibilitychange", updatePlayback);
        updatePlayback();
      })();
    </script>
  </body>
</html>
